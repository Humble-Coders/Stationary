<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account - Stationary</title>
    
    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, deleteDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBts8BgS_MG_C8k_kT4-nJkbWMxad69PU8",
            authDomain: "stationary-16708.firebaseapp.com",
            projectId: "stationary-16708",
            storageBucket: "stationary-16708.firebasestorage.app",
            messagingSenderId: "442101758169",
            appId: "1:442101758169:web:3ed91b7513332d830ca6c8",
            measurementId: "G-8XGVF9YP2E"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        // Make Firebase available globally
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseDeleteUser = deleteUser;
        window.firebaseSignIn = signInWithEmailAndPassword;
        window.firebaseSendPasswordReset = sendPasswordResetEmail;
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .warning-box {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .warning-box strong {
            color: #856404;
            display: block;
            margin-bottom: 8px;
        }

        .warning-box ul {
            margin-left: 20px;
            color: #856404;
            font-size: 0.9em;
        }

        .warning-box li {
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
            margin-top: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.9em;
            color: #555;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            background-color: #fee;
            border: 2px solid #fcc;
            color: #c33;
        }

        .message.success {
            background-color: #efe;
            border: 2px solid #cfc;
            color: #3c3;
        }

        .message.info {
            background-color: #e3f2fd;
            border: 2px solid #90caf9;
            color: #1976d2;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .help-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .help-text a {
            color: #667eea;
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.7em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🖨️</div>
            <h1>Delete Account</h1>
            <p class="subtitle">Stationary Print Shop</p>
        </div>

        <div class="warning-box">
            <strong>⚠️ Warning: This action cannot be undone</strong>
            <ul>
                <li>All your account data will be permanently deleted</li>
                <li>Your order history will be removed</li>
                <li>You will lose access to all services</li>
                <li>This action is irreversible</li>
            </ul>
        </div>

        <div id="message" class="message"></div>

        <form id="deleteAccountForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your registered email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="confirmDelete" name="confirmDelete" required>
                <label for="confirmDelete">
                    I understand that deleting my account will permanently remove all my data and this action cannot be undone.
                </label>
            </div>

            <button type="submit" class="btn btn-primary" id="deleteBtn">
                Delete My Account
            </button>
        </form>

        <button type="button" class="btn btn-secondary" onclick="window.location.href='privacy-policy.html'">
            View Privacy Policy
        </button>

        <div class="help-text">
            Need help? <a href="mailto:humblesolutions2025@gmail.com">Contact Support</a>
        </div>
    </div>

    <script>
        // Wait for Firebase to load
        window.addEventListener('load', () => {
            const form = document.getElementById('deleteAccountForm');
            const messageDiv = document.getElementById('message');
            const deleteBtn = document.getElementById('deleteBtn');

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                messageDiv.style.display = 'block';
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }

            function setLoading(loading) {
                if (loading) {
                    deleteBtn.disabled = true;
                    deleteBtn.innerHTML = '<span class="loading"></span>Processing...';
                } else {
                    deleteBtn.disabled = false;
                    deleteBtn.textContent = 'Delete My Account';
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmDelete = document.getElementById('confirmDelete').checked;

                if (!confirmDelete) {
                    showMessage('Please confirm that you understand the consequences of deleting your account.', 'error');
                    return;
                }

                setLoading(true);

                try {
                    // Wait for Firebase to be available
                    if (!window.firebaseAuth) {
                        throw new Error('Firebase is still loading. Please wait a moment and try again.');
                    }

                    // Sign in the user
                    showMessage('Authenticating...', 'info');
                    const userCredential = await window.firebaseSignIn(window.firebaseAuth, email, password);
                    const user = userCredential.user;

                    // Delete user data from Firestore
                    showMessage('Deleting your data...', 'info');
                    const db = window.firebaseDb;
                    
                    // Delete user document
                    try {
                        const userDocRef = doc(db, 'users', user.uid);
                        await deleteDoc(userDocRef);
                    } catch (err) {
                        console.warn('User document not found or already deleted:', err);
                    }

                    // Delete user's print orders
                    try {
                        const printOrdersRef = collection(db, 'print_orders');
                        const printOrdersQuery = query(printOrdersRef, where('customerId', '==', user.uid));
                        const printOrdersSnapshot = await getDocs(printOrdersQuery);
                        
                        const deletePrintOrdersPromises = [];
                        printOrdersSnapshot.forEach((orderDoc) => {
                            deletePrintOrdersPromises.push(deleteDoc(orderDoc.ref));
                        });
                        await Promise.all(deletePrintOrdersPromises);
                    } catch (err) {
                        console.warn('Error deleting print orders:', err);
                    }

                    // Delete user's payment transactions
                    try {
                        const paymentTransactionsRef = collection(db, 'payment_transactions');
                        const paymentQuery = query(paymentTransactionsRef, where('customerId', '==', user.uid));
                        const paymentSnapshot = await getDocs(paymentQuery);
                        
                        const deletePaymentPromises = [];
                        paymentSnapshot.forEach((paymentDoc) => {
                            deletePaymentPromises.push(deleteDoc(paymentDoc.ref));
                        });
                        await Promise.all(deletePaymentPromises);
                    } catch (err) {
                        console.warn('Error deleting payment transactions:', err);
                    }

                    // Delete user's notifications
                    try {
                        const notificationsRef = collection(db, 'notifications');
                        const notifQuery = query(notificationsRef, where('userId', '==', user.uid));
                        const notifSnapshot = await getDocs(notifQuery);
                        
                        const deleteNotifPromises = [];
                        notifSnapshot.forEach((notifDoc) => {
                            deleteNotifPromises.push(deleteDoc(notifDoc.ref));
                        });
                        await Promise.all(deleteNotifPromises);
                    } catch (err) {
                        console.warn('Error deleting notifications:', err);
                    }

                    // Delete the Firebase Auth account
                    showMessage('Removing your account...', 'info');
                    await window.firebaseDeleteUser(user);

                    // Success
                    showMessage('Your account has been successfully deleted. We\'re sorry to see you go!', 'success');
                    form.reset();
                    
                    // Redirect after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'privacy-policy.html';
                    }, 3000);

                } catch (error) {
                    console.error('Error deleting account:', error);
                    let errorMessage = 'An error occurred while deleting your account. ';
                    
                    switch (error.code) {
                        case 'auth/user-not-found':
                            errorMessage += 'No account found with this email address.';
                            break;
                        case 'auth/wrong-password':
                            errorMessage += 'Incorrect password. Please try again.';
                            break;
                        case 'auth/invalid-email':
                            errorMessage += 'Invalid email address.';
                            break;
                        case 'auth/too-many-requests':
                            errorMessage += 'Too many failed attempts. Please try again later.';
                            break;
                        case 'auth/network-request-failed':
                            errorMessage += 'Network error. Please check your connection and try again.';
                            break;
                        default:
                            errorMessage += error.message || 'Please contact support if the problem persists.';
                    }
                    
                    showMessage(errorMessage, 'error');
                } finally {
                    setLoading(false);
                }
            });
        });
    </script>
</body>
</html>
